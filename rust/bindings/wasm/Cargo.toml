[package]
name = "cypher-wasm"
version = "0.1.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/konsept/cypher"
description = "wasm-bindgen TypeScript SDK over cypher-core broadcast mode"

[lib]
crate-type = ["cdylib"]

[dependencies]
cypher-core = { path = "../../core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
# OsRng under wasm: getrandom's js backend routes to crypto.getRandomValues.
getrandom = { version = "0.2", features = ["js"] }
